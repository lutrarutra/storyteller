name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]" pygments
          npm ci

      - name: Lint
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests

      - name: Vendored files
        run: npm run vendor:check

      - name: Python tests
        run: uv run --no-sync python -m pytest -q

      - name: Runtime tests
        run: npm test

      - name: Browser checks
        run: |
          npx playwright-core install --with-deps chromium
          uv run --no-sync storyteller demo -o "$RUNNER_TEMP/demo.html"
          node tests/e2e/check_report.mjs "$RUNNER_TEMP/demo.html" "$RUNNER_TEMP/e2e"
          node tests/e2e/check_live.mjs "$PWD/.venv/bin/python" "$RUNNER_TEMP/live"
          node tests/e2e/check_comments.mjs "$PWD/.venv/bin/python" "$RUNNER_TEMP/comments"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.python }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
