[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.3.0"
description = "Standalone, offline HTML reports for data analysis, in code flower's style"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lutrarutra" }]
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "markdown-it-py>=3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# matplotlib, plotly, pandas and numpy are used when they are installed and
# objects of theirs are passed in; nothing requires them.
plot = ["matplotlib>=3.8", "plotly>=5.20", "pandas>=2.0", "numpy>=1.26"]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "plotly>=5.20", "pandas>=2.0", "numpy>=1.26"]

[project.scripts]
storyteller = "storyteller.cli:main"

[project.urls]
Homepage = "https://github.com/lutrarutra/storyteller"

[tool.hatch.build.targets.wheel]
packages = ["src/storyteller"]

[tool.hatch.build.targets.sdist]
include = ["src", "skill", "tests", "scripts", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter wraps code; long HTML string literals stay readable on one line.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
